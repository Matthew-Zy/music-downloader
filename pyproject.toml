[project]
name = "musicdownloader"
version = "0.1.0"
description = "A tool to download music from youtube music from .toml source files. Also remembers previous downloads and will only redownload songs if a higher quality version is available or unless prompted to."
readme = "README.md"
authors = [
    { name = "Matthew-Zy", email = "166348388+Matthew-Zy@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dacite>=1.9.2",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "tomli-w>=1.2.0",
    "yt-dlp-getpot-wpc>=1.1.2",
    "yt-dlp[default]>=2026.10.21",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
musicdownloader = "musicdownloader:main"
md = "musicdownloader:main"
mdutil = "mdutil:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
